<form class="form-horizontal" [formGroup]="form">
	<div class="form-group">
		<label for="name" class="col-sm-2 control-label">Name</label>
		<div class="col-sm-10">
			<input
				type="text"
				class="form-control"
				id="name"
				placeholder="Name"
				[formControl]="form.controls.name"
			/>
			<frm-validation-errors name="name"></frm-validation-errors>
		</div>
	</div>

	<div class="form-group">
		<label for="otherName" class="col-sm-2 control-label">Other Name</label>
		<div class="col-sm-10">
			<input
				type="text"
				class="form-control"
				id="otherName"
				placeholder="Other Name"
				[formControl]="form.controls.otherName"
			/>
			<frm-validation-errors name="otherName"></frm-validation-errors>
		</div>
	</div>

	<pre>
		{{ form.value | json }}
	</pre>

	<pre>
		{{ form.controls.name.errors | json }}
	</pre>
</form>
